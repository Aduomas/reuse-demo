<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --spec-h: 96px; }
  * { box-sizing: border-box; }
  body { font-family: var(--font-sans); color: var(--foreground); }
  .wrap { display: flex; flex-direction: column; gap: 20px; padding: 4px 0 8px; }
  .hero h1 { font-size: 22px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
  .hero p { margin: 0; color: var(--muted-foreground); font-size: 14px; line-height: 1.5; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .kpi { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .kpi .label { font-size: 12px; color: var(--muted-foreground); }
  .kpi .val { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .val .from { color: var(--muted-foreground); font-weight: 450; font-size: 16px; }
  .kpi .val .to { color: var(--success); }
  .clip { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--card); }
  .clip-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .clip h2 { font-size: 15px; margin: 0; }
  .clip .sub { font-size: 12.5px; color: var(--muted-foreground); margin-top: 3px; line-height: 1.4; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .play { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--primary); color: var(--primary-foreground); cursor: pointer; display: grid; place-items: center; flex: none; }
  .play svg { width: 14px; height: 14px; fill: currentColor; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; background: var(--background); }
  .seg button { border: 0; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 13px; font-weight: 550; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .seg button.on[data-v=before] { background: var(--destructive-surface, var(--secondary)); color: var(--foreground); }
  .seg button.on[data-v=after] { background: var(--success); color: var(--background); }
  .time { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--muted-foreground); margin-left: auto; }
  .specs { position: relative; border-radius: calc(var(--radius) - 2px); overflow: hidden; background: #07060b; cursor: pointer; }
  .row { position: relative; height: var(--spec-h); transition: opacity .2s; }
  .row + .row { border-top: 1px solid #ffffff1a; }
  .row canvas { width: 100%; height: 100%; display: block; }
  .row .tag { position: absolute; left: 8px; top: 6px; font-size: 11px; font-weight: 600; color: #fff; background: #00000080; padding: 2px 7px; border-radius: 999px; letter-spacing: .02em; }
  .row.dim { opacity: .38; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #ffffff99; font-size: 12px; pointer-events: none; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 8px #fff8; pointer-events: none; left: 0; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .m { font-size: 12px; color: var(--muted-foreground); }
  .m b { display: block; font-size: 15px; color: var(--foreground); font-variant-numeric: tabular-nums; font-weight: 600; margin-top: 2px; }
  .m b .up { color: var(--success); }
  .m b .down { color: var(--destructive); }
  .bar { height: 4px; border-radius: 2px; background: var(--secondary); margin-top: 6px; position: relative; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; }
  .bar i.b { background: var(--muted-foreground); opacity: .55; }
  .bar i.a { background: var(--success); height: 4px; mix-blend-mode: normal; }
  .foot { font-size: 12px; color: var(--muted-foreground); line-height: 1.55; }
  .foot b { color: var(--foreground); font-weight: 600; }
  @media (max-width: 520px) { .kpis, .metrics { grid-template-columns: 1fr 1fr 1fr; gap: 6px; } .kpi .val { font-size: 17px; } .hint { display: none; } :root { --spec-h: 72px; } }
</style>
</head>

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const avg = (k, side) => CLIPS.reduce((s, c) => s + c.scores[side][k], 0) / CLIPS.length;
const METRICS = [
  { k: "pesq", label: "Quality (PESQ, 1 to 4.5)", max: 4.5, min: 1, d: 2 },
  { k: "stoi", label: "Intelligibility (STOI)", max: 1, min: 0, d: 2 },
  { k: "si_sdr", label: "Speech vs noise (SI-SDR, dB)", max: 30, min: -20, d: 1 },
];

document.getElementById("kpis").innerHTML = METRICS.map(m => `
  <div class="kpi"><div class="label">Avg ${m.label}</div>
  <div class="val"><span class="from">${avg(m.k, "before").toFixed(m.d)} to </span><span class="to">${avg(m.k, "after").toFixed(m.d)}</span></div></div>`).join("");

// magma-ish colormap
const STOPS = [[0, 0, 0, 4], [0.25, 59, 15, 112], [0.5, 140, 41, 129], [0.7, 222, 73, 104], [0.85, 254, 159, 109], [1, 252, 253, 191]];
const cmap = v => { v = Math.min(1, Math.max(0, v)); let i = 1; while (STOPS[i][0] < v) i++; const [a, b] = [STOPS[i - 1], STOPS[i]]; const t = (v - a[0]) / (b[0] - a[0]); return [1, 2, 3].map(j => a[j] + (b[j] - a[j]) * t); };

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0;
      for (let j = 0; j < len / 2; j++) { const a = i + j, b = a + len / 2; const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti; const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr; } }
  }
}

// dB spectrogram on log-spaced rows; both versions share one ceiling so loudness stays comparable
function specDb(pcm) {
  const N = 512, H = 160, bins = N / 2, rows = 128, frames = Math.max(1, Math.floor((pcm.length - N) / H));
  const win = Float32Array.from({ length: N }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N));
  const rowBin = Array.from({ length: rows }, (_, r) => Math.min(bins - 1, Math.round(2 * Math.pow(bins / 2, (rows - 1 - r) / (rows - 1)))));
  const re = new Float32Array(N), im = new Float32Array(N), db = new Float32Array(frames * rows);
  let max = -Infinity;
  for (let f = 0; f < frames; f++) {
    for (let i = 0; i < N; i++) { re[i] = pcm[f * H + i] * win[i]; im[i] = 0; }
    fft(re, im);
    for (let r = 0; r < rows; r++) { const b = rowBin[r]; const v = 10 * Math.log10(re[b] * re[b] + im[b] * im[b] + 1e-10); db[r * frames + f] = v; if (v > max) max = v; }
  }
  return { db, frames, rows, max };
}

function paintSpec(canvas, s, ceil) {
  canvas.width = s.frames; canvas.height = s.rows;
  const ctx = canvas.getContext("2d"), img = ctx.createImageData(s.frames, s.rows);
  for (let i = 0; i < s.db.length; i++) { const [R, G, B] = cmap((s.db[i] - ceil + 75) / 70); img.data.set([R, G, B, 255], i * 4); }
  ctx.putImageData(img, 0, 0);
}

async function unpack(src) {
  const img = new Image(); img.src = src; await img.decode();
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data, rgb = new Uint8Array(c.width * c.height * 3);
  for (let i = 0, j = 0; i < d.length; i += 4) { rgb[j++] = d[i]; rgb[j++] = d[i + 1]; rgb[j++] = d[i + 2]; }
  const n = (rgb[0] << 24 | rgb[1] << 16 | rgb[2] << 8 | rgb[3]) >>> 0;
  return rgb.slice(4, 4 + n).buffer;
}

const players = [];
const ICON_PLAY = '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 10 10"><path d="M2 1h2v8H2zM6 1h2v8H6z"/></svg>';

CLIPS.forEach(c => {
  const el = document.createElement("div"); el.className = "clip";
  const delta = m => { const b = c.scores.before[m.k], a = c.scores.after[m.k]; const d = a - b;
    const pct = v => Math.max(2, (v - m.min) / (m.max - m.min) * 100);
    return `<div class="m">${m.label}<b>${b.toFixed(m.d)} to ${a.toFixed(m.d)} <span class="${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : ""}${d.toFixed(m.d)}</span></b>
      <div class="bar"><i class="a" style="width:${pct(a)}%"></i><i class="b" style="width:${pct(b)}%"></i></div></div>`; };
  el.innerHTML = `
    <div class="clip-head"><div><h2>${c.title}</h2><div class="sub">${c.sub}</div></div></div>
    <div class="controls">
      <button class="play" aria-label="Play">${ICON_PLAY}</button>
      <div class="seg"><button data-v="before">Before</button><button data-v="after" class="on">After</button></div>
      <span class="time">0:00 / ${fmt(c.end - c.start)}</span>
      <span class="hint">Click the spectrogram to seek</span>
    </div>
    <div class="specs">
      <div class="row" data-v="before"><canvas></canvas><span class="tag">BEFORE · ${c.tagBefore || "raw pendant audio"}</span></div>
      <div class="row" data-v="after"><canvas></canvas><span class="tag">AFTER · RE-USE</span></div>
      <div class="loading">Decoding audio</div>
      <div class="playhead"></div>
    </div>
    <div class="metrics">${METRICS.map(delta).join("")}</div>`;
  document.getElementById("clips").appendChild(el);

  const audio = { before: new Audio(), after: new Audio() };
  const st = { v: "after", playing: false };
  const btn = el.querySelector(".play"), time = el.querySelector(".time"), head = el.querySelector(".playhead"), specs = el.querySelector(".specs");
  const dur = c.end - c.start;
  const cur = () => audio[st.v];
  const paint = () => {
    el.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.v === st.v));
    el.querySelectorAll(".row").forEach(r => r.classList.toggle("dim", r.dataset.v !== st.v));
    btn.innerHTML = st.playing ? ICON_PAUSE : ICON_PLAY;
  };
  const tick = () => { const t = cur().currentTime; head.style.left = `${Math.min(100, t / dur * 100)}%`; time.textContent = `${fmt(t)} / ${fmt(dur)}`; if (st.playing) requestAnimationFrame(tick); };
  const pauseAll = () => players.forEach(p => p !== api && p.pause());
  const api = {
    pause() { Object.values(audio).forEach(a => a.pause()); st.playing = false; paint(); },
    play() { pauseAll(); cur().play(); st.playing = true; paint(); tick(); },
  };
  players.push(api);
  btn.onclick = () => st.playing ? api.pause() : api.play();
  el.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    if (b.dataset.v === st.v) return;
    const t = cur().currentTime; cur().pause(); st.v = b.dataset.v; cur().currentTime = t;
    if (st.playing) cur().play(); paint(); tick();
  });
  specs.onclick = e => { const r = specs.getBoundingClientRect(); const t = (e.clientX - r.left) / r.width * dur;
    Object.values(audio).forEach(a => a.currentTime = t); tick(); if (!st.playing) api.play(); };
  Object.values(audio).forEach(a => a.onended = () => { st.playing = false; Object.values(audio).forEach(x => x.currentTime = 0); paint(); tick(); });
  paint();

  const ac = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 16000, 16000);
  Promise.all(["before", "after"].map(v => unpack(c[v]).then(buf => {
      audio[v].src = URL.createObjectURL(new Blob([buf], { type: "audio/webm" })); audio[v].preload = "auto";
      return ac.decodeAudioData(buf.slice(0));
    })))
    .then(([b, a]) => {
      const sb = specDb(b.getChannelData(0)), sa = specDb(a.getChannelData(0)), ceil = Math.max(sb.max, sa.max);
      paintSpec(el.querySelector('.row[data-v=before] canvas'), sb, ceil);
      paintSpec(el.querySelector('.row[data-v=after] canvas'), sa, ceil);
      el.querySelector(".loading").remove();
      console.log("spec ok", c.name, b.duration.toFixed(2), a.duration.toFixed(2));
    }).catch(e => console.error("spec fail", c.name, e));
});

document.getElementById("foot").innerHTML = `
  <b>How this was made.</b> ${CLIPS.length} clips from internal recordings already committed as decoding fixtures in compass-app (Lithuanian office chatter, nothing sensitive). RE-USE ran with NVIDIA's weights unchanged; its Mamba layers were ported to CPU because this box has no GPU.
  Scores are <b>reference-free estimates</b> (torchaudio SQUIM), since there is no clean original to compare against. Audio here is re-encoded at 32 kbps Opus to fit the page.`;
